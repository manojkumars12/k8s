apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup-job
spec:
  schedule: "56 11 26 2 3"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: backup-container
            image: busybox
            command:
            - /bin/sh
            - -c
            - "echo 'Backing up database at $(date)' && sleep 10"
          restartPolicy: Never

